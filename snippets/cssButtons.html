<!DOCTYPE html>
<html>
<head>
  <title>Link Button</title>
  <style>

    a {
      background-color: blue;
      color: white;
      padding: 10px 20px;
      text-decoration: none;  /* removes the underline */
      border-radius: 10px;     /* rounds the corners */
    }
 

    a:hover {
      background-color: darkblue;
    }
  </style>
</head>
<body>
 <h1>Links that look like buttons... </h1>

  <p>
  <a href="https://www.ccbcmd.edu">Visit CCBC</a>
  </p>
    
    
 
</body>
</html>
